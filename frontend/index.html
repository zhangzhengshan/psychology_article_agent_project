<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心理学科普 Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: #f5f5f5;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .title {
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #222;
        }

        .input-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        #topicInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        #generateButton {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #1677ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #generateButton:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .panel {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel-title {
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        #logArea {
            white-space: pre-wrap;
            line-height: 1.8;
            color: #444;
        }

        #resultArea {
            white-space: pre-wrap;
            line-height: 1.8;
            color: #222;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="title">
            心理学科普 Agent
        </div>

        <div class="input-box">
            <input
                id="topicInput"
                type="text"
                placeholder="请输入文章主题，例如：为什么人会拖延"
            />

            <button id="generateButton">
                生成文章
            </button>
        </div>

        <div class="panel">
            <div class="panel-title">
                Agent执行日志
            </div>

            <div id="logArea"></div>
        </div>

        <div class="panel">
            <div class="panel-title">
                最终文章
            </div>

            <div id="resultArea"></div>
        </div>

    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
